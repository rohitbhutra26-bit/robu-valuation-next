<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Robu — Offline</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center; padding: 24px;
    background: #0A0A0B; color: #F4F5F8;
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .card { max-width: 360px; text-align: center; }
  .badge {
    width: 76px; height: 76px; border-radius: 22px; margin: 0 auto 22px;
    background: #7A2238; display: grid; place-items: center;
    box-shadow: 0 12px 32px rgba(122,34,56,.45);
  }
  .badge svg { width: 42px; height: 42px; }
  h1 { font-size: 20px; font-weight: 700; margin: 0 0 8px; letter-spacing: -.01em; }
  p { font-size: 15px; line-height: 1.55; color: #A1A1AA; margin: 0 0 24px; }
  button {
    appearance: none; border: 0; cursor: pointer;
    background: #FF5C86; color: #15090E; font-weight: 700; font-size: 15px;
    padding: 13px 26px; border-radius: 999px; transition: transform .15s ease, filter .15s ease;
  }
  button:active { transform: scale(.97); filter: brightness(1.05); }
</style>
</head>
<body>
  <div class="card">
    <div class="badge">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <g transform="translate(31.7,12) scale(0.41)">
          <path fill="#FFFFFF" fill-rule="evenodd" d="M1,82.47 C2.4,78.87 4.08,75.84 5.15,72.61 C11.93,52.24 25.31,38.41 45.34,30.63 C57.21,26.02 69.36,24.51 81.96,25.02 C86.26,25.2 87.97,27.02 87.85,31.14 C87.75,34.47 87.89,37.8 87.83,41.13 C87.72,47.02 86.94,47.48 81.16,47.97 C73.27,48.64 65.06,48.62 57.63,50.95 C43.32,55.44 33.63,65.82 29.13,80 C26.85,87.15 26.25,95.04 26.09,102.62 C25.7,121.76 25.97,140.91 25.99,160.53 C17.7,161 9.4,161 1,161 C1,134.98 1,108.96 1,82.47 z"/>
        </g>
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>Robu needs a connection to value live stocks. Check your internet and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
