<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <!-- Background — dark navy, works on any browser tab -->
  <rect width="40" height="40" rx="9" fill="#07111f"/>
  <!-- Subtle border ring in brand blue -->
  <rect x="0.75" y="0.75" width="38.5" height="38.5" rx="8.25" stroke="#60a5fa" stroke-width="1" stroke-opacity="0.4" fill="none"/>
  <!-- Geometric R — stem (vertical left bar) -->
  <rect x="7" y="7" width="7" height="26" rx="2" fill="#60a5fa"/>
  <!-- Top bar (horizontal cap) -->
  <rect x="7" y="7" width="21" height="7" rx="2" fill="#60a5fa"/>
  <!-- Bowl right (vertical right of bowl) -->
  <rect x="22" y="7" width="6" height="14" rx="2" fill="#60a5fa"/>
  <!-- Mid bar (horizontal divider) -->
  <rect x="7" y="14" width="21" height="7" rx="2" fill="#60a5fa"/>
  <!-- Diagonal leg -->
  <path d="M14 21 L21 21 L31 33 L24 33 Z" fill="#60a5fa"/>
</svg>
