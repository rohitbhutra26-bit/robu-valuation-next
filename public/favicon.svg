<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d1f3c"/>
    </linearGradient>
    <linearGradient id="rGrad" x1="7" y1="7" x2="31" y2="33" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f5c842"/>
      <stop offset="100%" stop-color="#e09b1a"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00c9a7"/>
      <stop offset="100%" stop-color="#0090ff"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="40" height="40" rx="10" fill="url(#bgGrad)"/>
  <!-- Outer glow border -->
  <rect x="0.5" y="0.5" width="39" height="39" rx="9.5" stroke="#f5c842" stroke-width="0.75" stroke-opacity="0.35" fill="none"/>
  <!-- R stem -->
  <rect x="7" y="7" width="5.5" height="26" rx="1.5" fill="url(#rGrad)"/>
  <!-- R top bar -->
  <rect x="7" y="7" width="18" height="5.5" rx="1.5" fill="url(#rGrad)"/>
  <!-- R bowl right -->
  <rect x="19.5" y="7" width="5" height="12" rx="1.5" fill="url(#rGrad)"/>
  <!-- R mid bar -->
  <rect x="7" y="13" width="18" height="5" rx="1.5" fill="url(#rGrad)"/>
  <!-- R leg (diagonal) -->
  <path d="M13.5 18 L20 18 L28.5 33 L22.5 33 Z" fill="url(#rGrad)"/>
  <!-- Teal accent bar — bottom right, like a bullish chart bar -->
  <rect x="29" y="26" width="3.5" height="7" rx="1" fill="#00c9a7" opacity="0.9"/>
  <rect x="24.5" y="29" width="3.5" height="4" rx="1" fill="#00c9a7" opacity="0.6"/>
</svg>